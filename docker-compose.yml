version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: quarkus-postgres
    environment:
      POSTGRES_DB: prueba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - quarkus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Quarkus
  quarkus-app:
    build: .
    container_name: quarkus-banking-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Configuración de base de datos
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/prueba
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      
      # Configuración de Flyway
      QUARKUS_FLYWAY_SCHEMAS: arq_hex
      QUARKUS_FLYWAY_MIGRATE_AT_START: true
      QUARKUS_FLYWAY_REPAIR_AT_START: true
      QUARKUS_FLYWAY_OUT_OF_ORDER: true
      
      # Configuración del servidor
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
      
      # Logs
      QUARKUS_LOG_LEVEL: INFO
      QUARKUS_LOG_CATEGORY__COM_RESOLUTIONS__LEVEL: DEBUG
    ports:
      - "8080:8080"
    networks:
      - quarkus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PgAdmin para administrar la base de datos (opcional)
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: quarkus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - quarkus-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  quarkus-network:
    driver: bridge