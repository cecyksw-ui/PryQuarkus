#quarkus configuration BD prueba
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/prueba
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.schema=arq_hex

# Flyway configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1.0.0
quarkus.flyway.repair-at-start=true
quarkus.flyway.out-of-order=true
quarkus.flyway.schemas=arq_hex
quarkus.flyway.default-schema=arq_hex
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.clean-at-start=true
quarkus.flyway.clean-disabled=false

# Hibernate configuration
quarkus.hibernate-orm.database.default-schema=arq_hex
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.database.generation=none

quarkus.log.console.enable=true
quarkus.log.level=INFO
quarkus.log.category."com.resolutions".level=DEBUG
quarkus.log.category."org.flywaydb".level=DEBUG
quarkus.log.category."io.agroal".level=DEBUG

# Health checks para Docker
quarkus.smallrye-health.ui.always-include=true

# OpenAPI/Swagger configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=Banking API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para gestión bancaria con arquitectura hexagonal
quarkus.log.min-level=TRACE
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.second-level-caching-enabled=false
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.validate-in-dev-mode=false

# Configuración temporal del servidor
quarkus.http.port=8081

# Configuración para Docker (perfil docker)
%docker.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/prueba
%docker.quarkus.http.port=8080
%docker.quarkus.http.host=0.0.0.0